<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 小画家画廊</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF6F2;
  --surface:#FFFFFF;
  --text:#2C2C2C;
  --text-secondary:#8B8B8B;
  --border:#EBE5DE;
  --shadow:0 2px 12px rgba(0,0,0,0.06);
  --radius:16px;
  --radius-sm:10px;
  --primary:#D4A373;
  --primary-light:#EAD5B8;
  --accent:#6B9080;
  --accent-light:#A4C3B2;
  --warm:#E09F6E;
  --coral:#E07A5F;
  --header-h:64px;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif
}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
img{display:block;max-width:100%}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,textarea{font:inherit;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;background:var(--surface);color:var(--text);width:100%;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:80px}
select{-webkit-appearance:none;appearance:none;background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 fill=%22%238B8B8B%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 11L3 6h10z%22/%3E%3C/svg%3E');background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
.header{position:sticky;top:0;z-index:100;background:rgba(250,246,242,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.header-logo{font-size:20px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;cursor:pointer}
.header-logo span{background:linear-gradient(135deg,var(--coral),var(--warm));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--warm)}
.btn-outline{border:1.5px solid var(--border);color:var(--text);background:var(--surface)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-ghost{color:var(--text-secondary)}
.btn-ghost:hover{color:var(--text);background:rgba(0,0,0,.04)}
.btn-sm{padding:5px 12px;font-size:13px}
.btn-danger{color:var(--coral);border:1.5px solid rgba(224,122,95,.3)}
.btn-danger:hover{background:rgba(224,122,95,.08);border-color:var(--coral)}
.breadcrumb{display:flex;align-items:center;gap:6px;padding:16px 24px 0;font-size:13px;color:var(--text-secondary);flex-wrap:wrap}
.breadcrumb a{transition:color .2s;cursor:pointer;color:var(--text-secondary)}
.breadcrumb a:hover{color:var(--primary)}
.breadcrumb .sep{opacity:.4}
.breadcrumb .current{color:var(--text);font-weight:500}
.feature-bar{display:flex;gap:6px;padding:12px 24px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--surface);margin:0 0 24px}
.feature-tag{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;background:var(--bg);color:var(--text-secondary);cursor:default}
.feature-tag.active{background:var(--primary-light);color:var(--primary)}
.feature-tag .badge{background:var(--primary);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;line-height:16px}
.container{max-width:1280px;margin:0 auto;padding:0 24px 40px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.section-header h2{font-size:22px;font-weight:600;letter-spacing:-.3px}
.section-header .sub{color:var(--text-secondary);font-size:14px;font-weight:400}
.artist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:40px}
.artist-card{background:var(--surface);border-radius:var(--radius);padding:0;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:all .3s;border:2px solid transparent;overflow:hidden}
.artist-card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,.08);border-color:var(--primary-light)}
.artist-card-cover{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;overflow:hidden}
.artist-card-cover img{width:100%;height:100%;object-fit:cover}
.artist-card-info{padding:16px}
.artist-avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600;color:#fff}
.artist-name{font-size:16px;font-weight:600;margin-bottom:4px}
.artist-count{font-size:13px;color:var(--text-secondary)}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin-bottom:40px}
.album-card{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:all .3s;border:2px solid transparent}
.album-card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,.08);border-color:var(--primary-light)}
.album-cover{aspect-ratio:4/3;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--text-secondary);overflow:hidden}
.album-cover img{width:100%;height:100%;object-fit:cover}
.album-info{padding:14px 16px}
.album-info h3{font-size:15px;font-weight:600;margin-bottom:3px}
.album-info p{font-size:13px;color:var(--text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.artwork-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.artwork-card{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:all .3s;border:2px solid transparent}
.artwork-card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,.08);border-color:var(--primary-light)}
.artwork-img{aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.artwork-img img{width:100%;height:100%;object-fit:cover;transition:opacity .4s,transform .4s;opacity:0}.artwork-img img.loaded{opacity:1}
.artwork-card:hover .artwork-img img{transform:scale(1.05)}
.artwork-info{padding:14px 16px}
.artwork-info h3{font-size:14px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artwork-info .meta{font-size:12px;color:var(--text-secondary)}
.artwork-info .desc{font-size:13px;color:var(--text-secondary);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty-state{text-align:center;padding:80px 20px;color:var(--text-secondary)}
.empty-state .icon{font-size:56px;margin-bottom:16px;opacity:.5}
.empty-state h3{font-size:18px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty-state p{font-size:14px;max-width:360px;margin:0 auto 20px}
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
.modal{background:var(--surface);border-radius:var(--radius);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:slideUp .25s}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:18px;font-weight:600}
.modal-body{padding:24px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--border)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text)}
.upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:32px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg)}
.upload-area:hover,.upload-area.dragover{border-color:var(--primary);background:var(--primary-light)}
.upload-area .icon{font-size:40px;margin-bottom:8px}
.upload-preview{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.upload-preview img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:2px solid var(--border)}
.lightbox-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:40px;animation:fadeIn .3s}
.lightbox{display:flex;gap:24px;align-items:flex-start;max-width:90vw}
.lightbox-img{max-width:70vw;max-height:80vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);opacity:0;transition:opacity .4s}.lightbox-img.loaded{opacity:1}
.lightbox-info{background:var(--surface);border-radius:12px;padding:20px;min-width:220px;max-width:300px;flex-shrink:0}
.lightbox-info h2{font-size:16px;font-weight:600;margin-bottom:4px}
.lightbox-close{position:fixed;top:20px;right:24px;z-index:301;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:none}
.lightbox-close:hover{background:rgba(255,255,255,.25)}
.lightbox-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:301;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:none}
.lightbox-nav:hover{background:rgba(255,255,255,.22)}
.lightbox-prev{left:20px}.lightbox-next{right:20px}
.avatar-colors{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.avatar-color{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s}
.avatar-color:hover,.avatar-color.selected{border-color:var(--text);transform:scale(1.1)}
.loading-spinner{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.loading-spinner .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@media(max-width:768px){
  .lightbox{flex-direction:column;align-items:center}
  .lightbox-img{max-width:95vw;max-height:60vh}
  .lightbox-info{max-width:95vw;width:100%}
  .artist-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .album-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .artwork-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .header{padding:0 16px}
  .container{padding:0 16px 32px}
  .breadcrumb{padding:12px 16px 0}
  .feature-bar{padding:10px 16px;gap:4px}
}
</style>
</head>
<body>
<div id="app">
<header class="header">
  <div class="header-left">
    <div class="header-logo" id="logoHome">🎨 <span>小画家画廊</span></div>
  </div>
  <div class="header-actions" id="headerActions"></div>
</header>
<div class="breadcrumb" id="breadcrumb"></div>
<div class="feature-bar" id="featureBar"></div>
<div class="container" id="mainContent"></div>
<div id="modalContainer"></div>
</div>
<script>
// ═══════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════
var COLORS = ['#D4A373','#E07A5F','#81B29A','#6B9080','#E09F6E','#A4C3B2','#F2CC8F','#C77DFF','#72EFDD','#FF99C8','#AACCFF','#FFD6A5'];

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
var D = { a: [], b: [], w: [] };  // Artists, Albums, Artworks (matches web version field names)
var S = { v: 'home', aid: null, bid: null, wid: null, li: -1, mo: null, ei: null };
var UI = [];
var _loading = false;

function id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

// ═══════════════════════════════════════
// IMAGE URL HELPER
// ═══════════════════════════════════════
function imgUrl(url) {
  if (!url) return '';
  if (url.startsWith('http://') || url.startsWith('https://')) {
    // R2 private object -> serve via backend signed-URL route (bucket stays private)
    var m = url.match(/compressed_([^\/.?]+)/);
    if (m && (url.indexOf('r2.cloudflarestorage.com') > -1 || url.indexOf('r2.dev') > -1)) {
      return '/api/artworks/' + m[1] + '/image';
    }
    return url;
  }
  return '/images/' + url;
}

function origUrl(artwork) {
  var url = artwork.original_file || artwork.io || '';
  if (!url) return imgUrl(artwork.compressed_file || artwork.i);
  if (url.startsWith('http://') || url.startsWith('https://')) return url;
  return '/images/' + url;
}

// ═══════════════════════════════════════
// API CLIENT
// ═══════════════════════════════════════
async function api(method, path, body) {
  var opts = { method, headers: {} };
  if (body instanceof FormData) {
    opts.body = body;  // multipart, no content-type header (browser sets it)
  } else if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  var res = await fetch('/api' + path, opts);
  if (!res.ok) {
    var err = await res.json().catch(function(){ return { error: res.statusText }; });
    throw new Error(err.error || 'Request failed');
  }
  return res.json();
}

// ═══════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════
async function loadAll() {
  _loading = true; R();
  try {
    var [artists, albums, artworks] = await Promise.all([
      api('GET', '/artists'),
      api('GET', '/albums'),
      api('GET', '/artworks'),
    ]);
    D.a = artists;
    D.b = albums;
    D.w = artworks;
  } catch (e) {
    console.error('Load failed:', e);
  }
  _loading = false;
  R();
}

// ═══════════════════════════════════════
// UTILITY
// ═══════════════════════════════════════
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sk(el){el.style.animation='shake .3s';setTimeout(function(){el.style.animation='';},300);}
function todayCN(){return new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});}
function txc(hex){if(!hex||hex[0]!=='#')return '#2C2C2C';var r=parseInt(hex.slice(1,3),16)/255;var g=parseInt(hex.slice(3,5),16)/255;var b=parseInt(hex.slice(5,7),16)/255;return .299*r+.587*g+.114*b>.6?'#2C2C2C':'#fff';}

// ═══════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════
function nav(v,id2){
  S.v=v;
  if(v==='home'){S.aid=null;S.bid=null;S.wid=null;}
  else if(v==='artist'){S.aid=id2;S.bid=null;S.wid=null;}
  else if(v==='album'){S.bid=id2;var al=D.b.find(function(x){return x.id===id2});S.aid=al?(al.artist_id||al.aid):null;S.wid=null;}
  else if(v==='artwork'){S.wid=id2;S.li=-1;}
  R();
}

document.getElementById('logoHome').addEventListener('click',function(){nav('home');});

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function R(){
  // Breadcrumb
  var el=document.getElementById('breadcrumb');
  if(!el)return;
  var c=[{l:'🏠 首页',a:'home'}];
  if(S.aid){var at=D.a.find(function(x){return x.id===S.aid});if(at)c.push({l:at.n||at.name,a:'artist',id:at.id});}
  if(S.bid){var al=D.b.find(function(x){return x.id===S.bid});if(al)c.push({l:al.n||al.name,a:'album',id:al.id});}
  el.innerHTML=c.map(function(x,i){
    var sep=i>0?' <span class="sep">▸</span> ':'';
    if(i===c.length-1)return sep+'<span class="current">'+esc(x.l)+'</span>';
    return sep+'<a onclick="nav(\''+x.a+'\',\''+(x.id||'')+'\')">'+esc(x.l)+'</a>';
  }).join('');

  // Feature bar
  var fb=document.getElementById('featureBar');
  if(fb){
    var tags=[];
    if(S.v==='home')tags=[{l:'👤 小画家管理',a:'home'},{l:'🖼️ 画集管理',a:'home'},{l:'📸 作品上传',a:'home'},{l:'✨ 作品展示',a:'home'}];
    else if(S.v==='artist')tags=[{l:'👤 小画家信息',a:'artist',id:S.aid},{l:'🖼️ 画集管理',a:'artist',id:S.aid},{l:'📸 上传作品',a:'modal',m:'uploadArtwork'},{l:'✨ 浏览作品',a:'artist',id:S.aid}];
    else if(S.v==='album')tags=[{l:'🖼️ 画集信息',a:'album',id:S.bid},{l:'📸 上传作品',a:'modal',m:'uploadArtwork'},{l:'✨ 作品展示',a:'album',id:S.bid}];
    else if(S.v==='artwork')tags=[{l:'✨ 作品详情',a:'artwork',id:S.wid},{l:'✏️ 编辑作品',a:'modal',m:'editArtwork'},{l:'🗑️ 删除作品',a:'modal',m:'deleteArtwork'}];
    fb.innerHTML=tags.map(function(t){var click='';if(t.a==='modal')click=' onclick="M(\''+t.m+'\')"';else click=' onclick="nav(\''+t.a+'\',\''+(t.id||'')+'\')"';return '<span class="feature-tag" style="cursor:pointer"'+click+'><span class="icon">'+t.l.slice(0,2)+'</span>'+t.l.slice(2)+'</span>';}).join('');
  }

  // Header actions
  var ha=document.getElementById('headerActions');
  if(ha){
    var b=[];
    if(S.v==='home')b.push({l:'+ 新建小画家',c:'btn btn-primary',a:'addArtist'});
    else if(S.v==='artist'){b.push({l:'+ 新建画集',c:'btn btn-primary btn-sm',a:'addAlbum'});b.push({l:'📸 上传',c:'btn btn-outline btn-sm',a:'uploadArtwork'});b.push({l:'← 返回',c:'btn btn-ghost btn-sm',a:'home'});}
    else if(S.v==='album'){b.push({l:'📸 上传',c:'btn btn-primary btn-sm',a:'uploadArtwork'});b.push({l:'← 返回',c:'btn btn-ghost btn-sm',a:'artist',id:S.aid});}
    else if(S.v==='artwork')b.push({l:'← 返回',c:'btn btn-ghost btn-sm',a:'album',id:S.bid});
    ha.innerHTML=b.map(function(x){return '<button class="'+x.c+'" data-a="'+x.a+'" data-id="'+(x.id||'')+'">'+x.l+'</button>';}).join('');
    ha.querySelectorAll('button[data-a]').forEach(function(bn){
      bn.addEventListener('click',function(e){
        var a=e.currentTarget.dataset.a;
        var id2=e.currentTarget.dataset.id;
        if(a==='addArtist')M('addArtist');
        else if(a==='addAlbum')M('addAlbum');
        else if(a==='uploadArtwork')M('uploadArtwork');
        else if(a==='home'||a==='artist'||a==='album')nav(a,id2||undefined);
      });
    });
  }

  // Main content
  var mc=document.getElementById('mainContent');
  if(!mc)return;

  if(_loading){
    mc.innerHTML='<div class="loading-spinner"><div class="spinner"></div><p>加载中...</p></div>';
    return;
  }

  if(S.v==='home')mc.innerHTML=home();
  else if(S.v==='artist')mc.innerHTML=artist();
  else if(S.v==='album')mc.innerHTML=album();
  else if(S.v==='artwork')mc.innerHTML=detail();
  AI();
  MO();
}

function home(){
  var as=D.a;
  if(as.length===0)return '<div class="empty-state"><div class="icon">👤</div><h3>还没有小画家</h3><p>点击上方"新建小画家"开始创建吧 🎨</p></div>';
  var h='<div class="section-header"><div><h2>所有小画家</h2><span class="sub">共 '+as.length+' 位小画家 · '+D.b.length+' 个画集 · '+D.w.length+' 幅作品</span></div></div><div class="artist-grid">';
  as.forEach(function(a){
    var ac=D.b.filter(function(b){return b.aid===a.id||b.artist_id===a.id}).length;
    var wc=D.w.filter(function(w){return w.aid===a.id||w.artist_id===a.id}).length;
    var firstW=D.w.filter(function(w){return (w.aid||w.artist_id)===a.id}).sort(function(x,y){return (y.created_at||'').localeCompare(x.created_at||'');})[0];
    var cover=firstW?imgUrl(firstW.compressed_file||firstW.i):null;
    h+='<div class="artist-card" onclick="nav(\'artist\',\''+a.id+'\')">';
    h+='<div class="artist-card-cover" style="background:'+a.c+';color:'+txc(a.c)+'">';
    h+=cover?'<img src="'+cover+'" alt="'+esc(a.n||a.name)+'" loading="lazy">':'🎨';

function downloadImg(artworkId){
  var w=D.w.find(function(x){return x.id===artworkId});
  if(!w)return;
  var url=origUrl(w);
  var ext=url.split('.').pop().split('?')[0]||'jpg';
  fetch(url).then(function(r){return r.blob()}).then(function(b){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=(w.t||w.title||'artwork')+'.'+ext;
    a.click();
    URL.revokeObjectURL(a.href);
  }).catch(function(){alert('下载失败');});
}

async function CF(id){
  if(!confirm('确定要删除这幅作品吗？'))return;
  try {
    await api('DELETE', '/artworks/' + id);
    D.w=D.w.filter(function(w){return w.id!==id});
    if(S.wid===id){
      var ws=D.w.filter(function(w){return (w.bid||w.album_id)===S.bid});
      if(ws.length>0)nav('artwork',ws[0].id);else nav('album',S.bid);
    }else R();
  } catch(e) { alert('删除失败: ' + e.message); }
}

async function deleteArtist(id){
  if(!confirm('确定要删除这位小画家及其所有画集和作品吗？'))return;
  try {
    await api('DELETE', '/artists/' + id);
    D.w=D.w.filter(function(w){return (w.aid||w.artist_id)!==id});
    D.b=D.b.filter(function(b){return (b.aid||b.artist_id)!==id});
    D.a=D.a.filter(function(a){return a.id!==id});
    if(S.aid===id)nav('home');else R();
  } catch(e) { alert('删除失败: ' + e.message); }
}

async function deleteAlbum(id){
  if(!confirm('确定要删除这个画集及其所有作品吗？'))return;
  try {
    await api('DELETE', '/albums/' + id);
    D.w=D.w.filter(function(w){return (w.bid||w.album_id)!==id});
    D.b=D.b.filter(function(b){return b.id!==id});
    if(S.bid===id)nav('artist',S.aid);else R();
  } catch(e) { alert('删除失败: ' + e.message); }
}

function OL(id){
  var ws=D.w.filter(function(w){return (w.bid||w.album_id)===S.bid});
  var idx=ws.findIndex(function(w){return w.id===id});
  if(idx<0)return;
  S.li=idx;
  LB();
}

function LB(){
  var ws=D.w.filter(function(w){return (w.bid||w.album_id)===S.bid});
  var w=ws[S.li];
  if(!w){document.getElementById('modalContainer').innerHTML='';return;}
  var h='<div class="lightbox-overlay" id="LBO"><button class="lightbox-close" onclick="LBX()">✕</button>';
  if(S.li>0)h+='<button class="lightbox-nav lightbox-prev" onclick="LBP()">◀</button>';
  if(S.li<ws.length-1)h+='<button class="lightbox-nav lightbox-next" onclick="LBN()">▶</button>';
  h+='<div class="lightbox"><img src="'+imgUrl(w.compressed_file||w.i)+'" class="lightbox-img" alt="'+esc(w.t||w.title)+'"><div class="lightbox-info"><h2>'+esc(w.t||w.title)+'</h2><div class="meta">'+(w.d||w.date||'')+'</div>'+(w.desc||w.description?'<p style="font-size:14px;line-height:1.6;margin-top:8px">'+esc(w.desc||w.description)+'</p>':'')+'<div style="margin-top:12px;font-size:12px;color:var(--text-secondary)">'+(S.li+1)+' / '+ws.length+'</div></div></div></div>';
  document.getElementById('modalContainer').innerHTML=h;
  document.getElementById('LBO').addEventListener('click',function(e){if(e.target===e.currentTarget){S.li=-1;document.getElementById('modalContainer').innerHTML='';}});
  document.addEventListener('keydown',LKK);
  setTimeout(AI,50);
}
function LBX(){S.li=-1;document.getElementById('modalContainer').innerHTML='';document.removeEventListener('keydown',LKK);}
function LBP(){S.li--;LB();}
function LBN(){S.li++;LB();}
function LKK(e){
  if(S.li<0){document.removeEventListener('keydown',LKK);return;}
  if(e.key==='Escape')LBX();
  var ws=D.w.filter(function(w){return (w.bid||w.album_id)===S.bid});
  if(e.key==='ArrowLeft'&&S.li>0){S.li--;LB();}
  if(e.key==='ArrowRight'&&S.li<ws.length-1){S.li++;LB();}
}

        Object.assign(al,updated);
        C();R();
      } catch(e) { alert('保存失败: '+e.message); }
    });
  }

  // Delete album
  var dB=document.getElementById('dBtn');
  if(dB){
    dB.addEventListener('click',function(){deleteAlbum(dB.dataset.id);});
  }

  // Submit upload — batch sequential
  var sUW=document.getElementById('sUW');
  if(sUW){
    sUW.addEventListener('click',async function(){
      var aid=document.getElementById('fWA').value;
      var bid=document.getElementById('fWB').value;
      var desc=document.getElementById('fWD').value.trim();
      if(!aid||!bid||UI.length===0){sk(sUW);return;}
      sUW.disabled=true;
      var total=UI.length, idx=0, ok=0, fails=[];
      sUW.textContent='0/'+total+' 上传中…';
      for(var i=0;i<total;i++){
        var item=UI[i];
        var title=item.title.trim()||item.file.name.replace(/\.[^.]+$/,'');
        sUW.textContent=(i+1)+'/'+total+' '+esc(title)+'…';
        try {
          var fd=new FormData();
          fd.append('albumId',bid);
          fd.append('artistId',aid);
          fd.append('title',title);
          fd.append('description',desc);
          fd.append('image',item.file);
          var artwork=await api('POST','/artworks',fd);
          D.w.push(artwork);
          ok++;
        } catch(e) {
          fails.push(title+': '+e.message);
        }
      }
      sUW.disabled=false;
      if(fails.length>0){
        alert('上传完成：'+ok+' 成功，'+fails.length+' 失败\n'+fails.join('\n'));
      }
      C();R();UI=[];
    });
  }

  // Submit edit artwork
  var sEW=document.getElementById('sEW');
  if(sEW){
    sEW.addEventListener('click',async function(){
      var w=D.w.find(function(x){return x.id===S.ei});
      if(!w)return;
      var t=document.getElementById('fWT').value.trim();
      if(!t){sk(sEW);return;}
      try {
        var updated=await api('PUT','/artworks/'+w.id,{title:t,description:document.getElementById('fWD').value.trim()});
        Object.assign(w,updated);
        C();R();
      } catch(e) { alert('保存失败: '+e.message); }
    });
  }
}

// ═══════════════════════════════════════
// FILE HANDLING
// ═══════════════════════════════════════

function HF(files){
  Array.from(files).forEach(function(file){
    if(!file.type.startsWith('image/'))return;
    var name=file.name.replace(/\.[^.]+$/,'');
    UI.push({file:file, title:name});
  });
  RUP();
}

function RUP(){
  var up=document.getElementById('fUP');
  if(!up)return;
  up.innerHTML=UI.map(function(item,i){
    var url=URL.createObjectURL(item.file);
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--surface)">'+
      '<img src="'+url+'" style="width:52px;height:52px;object-fit:cover;border-radius:6px;flex-shrink:0">'+
      '<input type="text" class="fTitle" data-idx="'+i+'" value="'+esc(item.title)+'" style="flex:1;min-width:0;padding:6px 10px;font-size:13px" maxlength="40">'+
      '<button onclick="UI.splice('+i+',1);RUP();" style="width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;font-size:12px;border:none;cursor:pointer;flex-shrink:0;line-height:26px;text-align:center">✕</button>'+
      '</div>';
  }).join('');
  // Sync title edits back to UI
  document.querySelectorAll('.fTitle').forEach(function(inp){
    inp.addEventListener('input',function(){
      var idx=parseInt(this.dataset.idx);
      if(UI[idx])UI[idx].title=this.value;
    });
  });
}

// ═══════════════════════════════════════
// IMAGE LOAD DETECTION
// ═══════════════════════════════════════
function AI(){
  setTimeout(function(){
    document.querySelectorAll('.artwork-img img,.lightbox-img').forEach(function(i){
      if(i.dataset.ai)return;i.dataset.ai='1';
      if(i.complete)i.classList.add('loaded');
      else i.addEventListener('load',function(){this.classList.add('loaded');});
    });
  },100);
}

// ═══════════════════════════════════════
// ARTIST-ALBUM SYNC
// ═══════════════════════════════════════
document.addEventListener('change',function(e){
  if(e.target.id==='fWA'){
    var aid=e.target.value;
    var as=document.getElementById('fWB');
    if(!as)return;
    var f=D.b.filter(function(b){return (b.aid||b.artist_id)===aid});
    as.innerHTML='<option value="">-- 请选择 --</option>'+f.map(function(b){return '<option value="'+b.id+'">'+esc(b.n||b.name)+'</option>';}).join('');
  }
});

// INIT
// ═══════════════════════════════════════
loadAll();
</script>
